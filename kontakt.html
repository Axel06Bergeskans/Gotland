<!DOCTYPE html>
<html lang="sv">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResGotland - Kontakt</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <section class="formularContainer">
        <h1>Boka, ändra eller avboka din resa:</h1>
        <form class="kontaktFormular" action="#">
            <label for="forNamn">Förnamn:</label>
            <input type="text" id="forNamn" name="forNamn" placeholder="Förnamn" required>
            <label for="efterNamn">Efternamn:</label>
            <input type="text" id="efterNamn" name="efterNamn" placeholder="Efternamn" required>
            <label for="email">E-post:</label>
            <input type="email" id="email" name="email" placeholder="E-post" required>
            <label for="datum">Resdatum:</label>
            <input type="date" id="datum" name="datum" required>
            <label for="antal" id="antal">Antal personer:</label>
            <input type="number" id="antal" name="antal" value="1" min="1" required>
            <label for="fraga">Fråga:</label>
            <textarea id="fraga" name="fraga" rows="4" cols="50"
                placeholder="Skriv eventuella frågor här, valfritt"></textarea>
            <input type="submit" value="Skicka">
        </form>
    </section>
    <footer class="indexFooter">
        <section class="footerNav">
            <p>
                <a href="index.html">
                    Hem
                </a>
            </p>
            <p>
                <a href="sevardheter.html">
                    Sevärdigheter
                </a>
            </p>
            <p>
                <a href="praktiskt.html">
                    Praktiskt
                </a>
            </p>
            <p>
                <a href="kontakt.html">
                    Kontakt
                </a>
            </p>
        </section>
    </footer>
</body>

</html>
